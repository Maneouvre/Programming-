<!DOCTYPE html>
<html lang="en">
<head>
    
    
    <link rel="stylesheet" href="rockpaperscissorsgame.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Rock Paper Scissors</title>

</head>
<body>
    <div class="header">
        <div class="title">Rock Paper Scissors Game</div>
        <div class="score-box">
            <div class="label">SCORE</div>
            <div class="score"><p class="js-score"></p></div>
        </div>
    </div>
    
    </div class="game-area">
        <div class="choices">
            <div class="choice paper" onclick="playGame('paper');">
                <span>🖐️</span>
            </div>
            <div class="choice scissors" onclick="playGame('scissors');">
                <span>✌️</span>
            </div>
            <div class="choice rock" onclick="playGame('rock');">
                <span>✊</span>
            </div>
        </div>
    </div>
        <br><br><br>
     
    <div>
        <button class="autoplay" onclick="
             Autoplayer();
            ">Autoplay</button>
    
       <button class="resetscore" onclick="score.wins=0; score.losses=0; score.ties=0; localStorage.removeItem('score'); updateScoreElement();">Reset Score</button>
    </div>
    
    <br><br>
    
    <p  style="color: blue;" class="moves"></p>

    <script>
        let isAutoPlaying=false;
        let intervalId;

        
        function Autoplayer(){
            if (!isAutoPlaying){
           intervalId= setInterval(function(){
                const playerMove=pickComputerMove();
                playGame(playerMove);
            },1000)
        isAutoPlaying=true;
        }
        else {
            clearInterval(intervalId);
            isAutoPlaying=false;
        }
        }
        let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0, ties: 0 };

        updateScoreElement();

        function playGame(playerMove) {
            pickComputerMove();
            let result = '';

            if (playerMove === 'rock') {
                if (computerMove === 'rock') {
                    result = 'It\'s a tie!';
                } else if (computerMove === 'paper') {
                    result = 'You lose!';
                } else if (computerMove === 'scissors') {
                    result = 'You win!';
                }
            } else if (playerMove === 'paper') {
                if (computerMove === 'rock') {
                    result = 'You win!';
                } else if (computerMove === 'paper') {
                    result = 'It\'s a tie!';
                } else if (computerMove === 'scissors') {
                    result = 'You lose!';
                }
            } else if (playerMove === 'scissors') {
                if (computerMove === 'rock') {
                    result = 'You lose!';
                } else if (computerMove === 'paper') {
                    result = 'You win!';
                } else if (computerMove === 'scissors') {
                    result = 'It\'s a tie!';
                }
                
            }
           

            document.querySelector('.moves').innerHTML=`${result}. You chose ${playerMove}. The computer chose ${computerMove}.`;

            if (result === 'You win!') {
                score.wins += 1;
            } else if (result === 'You lose!') {
                score.losses += 1;
            } else if (result === 'It\'s a tie!') {
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));
            updateScoreElement();

            ert(`You chose ${playerMove}. The computer chose ${computerMove}. ${result}\nWins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`);
        }

        let computerMove = '';

        function pickComputerMove() {
            const randomNumber = Math.random();

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper';
            } else {
                computerMove = 'scissors';
            }
            return computerMove;
        }

        function updateScoreElement() {
            document.querySelector('.js-score').innerHTML = `Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`;
        }
        
    </script>
</body>
</html>
