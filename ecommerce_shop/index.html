<!DOCTYPE html>
<html>
  <head>
    <title>Ecommerce shop</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/header.css">
    <link rel="stylesheet" href="styles/pages/index.css">
  </head>
  <body>
    <div class="header">
      <div class="left-section">
        <a href="index.html" class="header-link">
          <img class="logo"
            src="images/logo-white.png" />
          <img class="mobile-logo"
            src="images/mobile-logo-white.png" />
        </a>
      </div>

      <div class="middle-section">
        <input class="search-bar" type="search" aria-label="Search products" placeholder="Search products" />

        <button class="search-button" type="button" aria-label="Search products">
          <img class="search-icon" src="images/icons/search-icon.png" alt="" />
        </button>
      </div>

      <div class="right-section">
        <a class="orders-link header-link" href="orders.html"><span class="orders-text">Orders</span></a>
        <a class="account-link header-link js-account-link" href="login.php" aria-label="Sign in">
          <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>
          <span class="account-text js-account-text">Sign in</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="" />
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <main class="home-page">
      <div class="products-grid js-products-grid" aria-live="polite"></div>
    </main>
    <script type="module" src="data/site-header.js"></script>
    <script type="module" src="data/amazon.js"></script>
     
  </body>
  
</html>
